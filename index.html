<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>受付システム</title>
  <style>
    /* 簡単なデザイン（適宜変更してください） */
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    #login-screen, #main-screen { max-width: 400px; margin: 0 auto; padding: 20px; }
    input { width: 80%; padding: 10px; margin: 10px 0; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    .error { color: red; font-size: 14px; }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- 1. ログイン画面 -->
  <!-- ========================================== -->
  <div id="login-screen">
    <h2>受付ブース ログイン</h2>
    <input type="text" id="booth-id" placeholder="ブースID (例: 12345)">
    <input type="password" id="booth-pass" placeholder="パスワード">
    <br>
    <button id="login-btn">ログイン</button>
    <p id="login-error" class="error"></p>
  </div>

  <!-- ========================================== -->
  <!-- 2. メイン画面（ログイン成功後に表示される） -->
  <!-- ========================================== -->
  <div id="main-screen" style="display: none;">
    <h2>受付カメラ画面</h2>
    <p>ブース: <span id="display-booth-id"></span></p>
    <button id="logout-btn">ログアウト</button>
    <hr>
    
    <!-- ここに、今まで作ったカメラ起動ボタンやQR読み取りの仕組みを入れます -->
    <button id="start-camera-btn">📷 カメラを起動</button>
    <br><br>
    <div id="camera-area">
      <!-- カメラ映像が映るエリア -->
    </div>
  </div>


  <!-- ========================================== -->
  <!-- Firebase と ログイン制御の JavaScript -->
  <!-- ========================================== -->
  <script type="module">
    // Firebase SDK の読み込み
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

    // ▼▼▼ Firebaseの設定（Firebaseコンソールからコピーして書き換えてください） ▼▼▼
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://uketuke-ai-cafe-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "YOUR_PROJECT_ID",
    };

    // 初期化
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // 画面要素の取得
    const loginScreen = document.getElementById('login-screen');
    const mainScreen = document.getElementById('main-screen');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const errorMsg = document.getElementById('login-error');

    // 自分の端末のセッショントークン
    let mySessionToken = "";
    let currentBoothId = "";

    // --------------------------------------------------
    // ログイン状態の監視（ページを開いた時やリロード時に自動実行）
    // --------------------------------------------------
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // ログイン済みの場合
        currentBoothId = user.email.split('@')[0]; // booth01@event.local -> booth01
        document.getElementById('display-booth-id').innerText = currentBoothId;
        
        // 時間チェックと多重ログイン判定を行う
        await checkPermissionAndStartSession(currentBoothId);
      } else {
        // 未ログインの場合：ログイン画面を表示
        loginScreen.style.display = "block";
        mainScreen.style.display = "none";
      }
    });

    // --------------------------------------------------
    // ログインボタンを押した時の処理
    // --------------------------------------------------
    loginBtn.addEventListener('click', () => {
      const id = document.getElementById('booth-id').value.trim();
      const pass = document.getElementById('booth-pass').value.trim();
      errorMsg.innerText = "";

      if (!id || !pass) {
        errorMsg.innerText = "IDとパスワードを入力してください。";
        return;
      }

      // 仮想メールアドレスを作成してログイン
      const email = id + "@event.local";
      
      loginBtn.innerText = "ログイン中...";
      
      signInWithEmailAndPassword(auth, email, pass)
        .then(() => {
          loginBtn.innerText = "ログイン";
          // 成功後の画面切り替えは onAuthStateChanged が自動でやってくれます
        })
        .catch((error) => {
          loginBtn.innerText = "ログイン";
          console.error(error);
          errorMsg.innerText = "IDまたはパスワードが間違っています。";
        });
    });

    // --------------------------------------------------
    // ログアウトボタン
    // --------------------------------------------------
    logoutBtn.addEventListener('click', () => {
      signOut(auth);
    });

    // --------------------------------------------------
    // 許可時間チェック ＆ トークン管理（多重ログイン防止）
    // --------------------------------------------------
    async function checkPermissionAndStartSession(boothId) {
      const boothRef = ref(db, 'config/booths/' + boothId);
      
      // 1. Firebaseからこのブースの許可時間を取得
      const snapshot = await get(boothRef);
      if (!snapshot.exists()) {
        alert("ブースの設定データが見つかりません。");
        signOut(auth);
        return;
      }

      const config = snapshot.val();
      
      // 2. 日時チェック (現在の日時と許可日時を比較)
      const now = new Date();
      const todayStr = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,'0') + "-" + String(now.getDate()).padStart(2,'0');
      const nowTimeStr = String(now.getHours()).padStart(2,'0') + ":" + String(now.getMinutes()).padStart(2,'0');

      if (config.date !== todayStr || nowTimeStr < config.startTime || nowTimeStr > config.endTime) {
        alert(`現在は利用時間外です。\n許可日: ${config.date}\n時間: ${config.startTime}〜${config.endTime}`);
        signOut(auth);
        return;
      }

      // 3. 多重ログイン防止のためのトークン発行
      // ランダムな文字列（トークン）を作ってFirebaseに上書き保存
      mySessionToken = Math.random().toString(36).substring(2);
      await set(ref(db, 'config/booths/' + boothId + '/activeToken'), mySessionToken);

      // 画面をメイン画面に切り替え
      loginScreen.style.display = "none";
      mainScreen.style.display = "block";

      // 4. トークンの監視（他の端末がログインしたら弾く）
      onValue(ref(db, 'config/booths/' + boothId + '/activeToken'), (snapshot) => {
        const dbToken = snapshot.val();
        // Firebase上のトークンが自分のものと違っていたら（＝誰かが後からログインしたら）
        if (dbToken && dbToken !== mySessionToken) {
          alert("別の端末でログインされたため、ログアウトしました。");
          signOut(auth); // 強制ログアウト
        }
      });
    }

  </script>
</body>
</html>
